services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_USER: user
      MYSQL_PASSWORD: ${MYSQL_PASS}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS}
      MYSQL_DATABASE: click2approve
    ports:
      - "3306:3306"
  api:
    depends_on:
      - db
    build: ./api
    image: click2approve-api:local
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ConnectionStrings__DefaultConnection=Server=db;Port=3306;Database=click2approve;User=user;Password=${MYSQL_PASS};
    ports:
      - "5555:5555"
    command: /app/wait-for-it.sh -t 60 db:3306 -- dotnet /app/Click2Approve.WebApi.dll
  ui:
    depends_on:
      - api
    build:
      context: ./ui
      args:
        - ENV=production
    environment:
      - VITE_API_BASE_URI=${API_DOMAIN}:5555
    image: click2approve-ui:local
    ports:
      - "3333:80"
